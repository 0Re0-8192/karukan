name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The engine and the IME state machine are platform-independent: lint and test them on Linux.
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p karukan-engine -p karukan-im --all-targets -- -D warnings
      - run: cargo test -p karukan-engine --lib --bins
      - run: cargo test -p karukan-im --lib

  windows:
    name: Windows (TSF, server, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --release -p karukan-tsf -p karukan-tsf-loader -p karukan-setup -p karukan-im --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test --release -p karukan-tsf --lib
          cargo test --release -p karukan-setup
      - name: Build
        run: |
          cargo build --release -p karukan-tsf -p karukan-tsf-loader -p karukan-setup
          cargo build --release -p karukan-im --bin karukan-imserver
