[package]
name = "karukan-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["karukan contributors"]
license.workspace = true
description = "Japanese input engine: romaji-to-hiragana conversion and neural kana-kanji conversion via llama.cpp"
repository.workspace = true
homepage.workspace = true
keywords = ["japanese", "ime", "romaji", "kana-kanji", "llama-cpp"]
categories = ["text-processing", "internationalization"]

[lib]
name = "karukan_engine"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

# llama.cpp bindings for GGUF inference
llama-cpp-2 = { version = "0.1", default-features = false, features = ["common"] }
yada = "0.7"

# HuggingFace model download
hf-hub = { version = "1.0", features = ["blocking"] }

# Unicode normalization (NFKC) for models whose tokenizer doesn't support full-width ASCII
unicode-normalization = "0.1"

# HuggingFace tokenizers for external BPE tokenization (bypasses llama.cpp's built-in tokenizer)
tokenizers = "0.23"

# OpenMP everywhere but Windows. On Windows ggml's own thread pool is used:
# MSVC's OpenMP threads spun between conversions on ~3 cores unless told
# otherwise, and with them a keystroke took 37 ms (p50, 4 threads, a 35 W
# 13900T typing at 120 ms a key) against 27 ms on ggml's pool, which sleeps
# between conversions by itself; under full load both run on one thread
# (`kanji::load`) and agree.
[target.'cfg(not(windows))'.dependencies]
llama-cpp-2 = { version = "0.1", default-features = false, features = ["openmp", "common"] }

[dev-dependencies]
criterion = "0.8"
tempfile.workspace = true

[[bench]]
name = "inference_bench"
harness = false
